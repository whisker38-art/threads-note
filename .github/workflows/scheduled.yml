name: 쓰레드 예약 발행

# schedule.json 에 적힌 시각이 지난 원고를 한 편씩 올린다.
# 30분마다 깨어나 확인만 하므로, 올릴 게 없으면 몇 초 만에 끝난다.
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '실제로 올리지 않고 확인만'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-scheduled
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 시간 된 원고 발행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            node run_schedule.mjs --dry
          else
            node run_schedule.mjs
          fi

      - name: 발행 기록 커밋
        if: ${{ inputs.dry != true }}
        run: |
          if [ -n "$(git status --porcelain schedule.json logs)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schedule.json logs
            git commit -m "예약 발행 기록 [skip ci]"
            git push
          else
            echo "변경 없음"
          fi
